<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>迷霧森林露營地｜沒力氣出門的夜晚，來營火旁坐一下</title>
    <meta name="description" content="免安裝、打開就能玩的 3D 療癒營火。當一隻圓滾滾的小動物，烤棉花糖、疊石頭許願，和陌生的旅人一起安靜地待一會兒。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="迷霧森林露營地｜沒力氣出門的夜晚，來營火旁坐一下" />
    <meta property="og:description" content="打開就能進來。烤棉花糖、疊一顆石頭許個願，和陌生的旅人一起烤火。" />
    <meta property="og:image" content="og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1d1714" />
  </head>
  <body>
    <div id="app"></div>

    <div id="ui">
      <header class="title">
        <span class="title-main">🔥 <span data-i18n>迷霧森林露營地</span></span>
        <span class="title-sub" data-i18n>沒力氣出門的夜晚，來營火旁坐一下</span>
      </header>

      <div id="idle-badge" class="idle-badge" data-i18n>🌙 掛機巡航中⋯ 動一下即可回來</div>

      <footer class="hint collapsed" id="hint">
        <span class="always"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <i data-i18n>移動</i></span>
        <span class="always short-only"><kbd>E</kbd> <i data-i18n>互動</i></span>
        <span><kbd>⇧</kbd> <i data-i18n>按住小跑步</i></span>
        <span class="only-forest"><kbd>E</kbd> <i data-i18n>添柴</i></span>
        <span class="only-forest"><kbd>F</kbd> <i data-i18n>烤棉花糖</i></span>
        <span class="only-treehouse"><kbd>E</kbd> <i data-i18n>點唱機點歌</i></span>
        <span class="only-lake"><kbd>F</kbd> <i data-i18n>碼頭盡頭釣魚</i></span>
        <span class="only-tent" data-i18n>🍅 番茄鐘在畫面上方</span>
        <span><kbd>Z</kbd> <i data-i18n>裹毯發呆</i></span>
        <span><kbd data-i18n>空白鍵</kbd> <i data-i18n>仰望星空</i></span>
        <span data-i18n>右鍵拖曳 旋轉 · 滾輪 縮放</span>
        <button type="button" class="hint-toggle always" id="hint-toggle" data-i18n>⌨️ 更多操作</button>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
