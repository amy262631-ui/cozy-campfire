<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>迷霧森林露營地</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="ui">
      <header class="title">
        <span class="title-main">🔥 <span data-i18n>迷霧森林露營地</span></span>
        <span class="title-sub" data-i18n>暖暖營火・療癒陪伴空間</span>
      </header>

      <div id="idle-badge" class="idle-badge" data-i18n>🌙 掛機巡航中⋯ 動一下即可回來</div>

      <footer class="hint">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <i data-i18n>移動</i></span>
        <span><kbd>⇧</kbd> <i data-i18n>按住小跑步</i></span>
        <span class="only-forest"><kbd>E</kbd> <i data-i18n>添柴</i></span>
        <span class="only-forest"><kbd>F</kbd> <i data-i18n>烤棉花糖</i></span>
        <span class="only-treehouse"><kbd>E</kbd> <i data-i18n>點唱機點歌</i></span>
        <span class="only-lake"><kbd>F</kbd> <i data-i18n>碼頭盡頭釣魚</i></span>
        <span class="only-tent" data-i18n>🍅 番茄鐘在畫面上方</span>
        <span><kbd>Z</kbd> <i data-i18n>裹毯發呆</i></span>
        <span><kbd data-i18n>空白鍵</kbd> <i data-i18n>仰望星空</i></span>
        <span data-i18n>右鍵拖曳 旋轉 · 滾輪 縮放</span>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
